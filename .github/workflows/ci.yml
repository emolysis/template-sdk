name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - log/**
      - ROADMAP.md
      - docs/product/**
      - AGENTS.md
      - CLAUDE.md
  pull_request:
    paths-ignore:
      - log/**
      - ROADMAP.md
      - docs/product/**
      - AGENTS.md
      - CLAUDE.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Opening a pull request as a draft starts no runner.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: task setup
        run: task setup
      - name: task gate
        run: task gate
